        else if(act==='invite'){ f.invite=!f.invite; f.dem=''; if(f.invite) setTimeout(()=>document.getElementById('formInvite')?.focus(),60); }
        else if(act==='dateautre'){ f.dateAutre=true; }
        else if(act==='heureautre'){ f.heureAutre=true; if(NF_HEURES[f.type]?.includes(f.heure)) f.heure=''; }
        if(f.type==='hotel') f.dateDepart=nfDepart(f);
        render();
    });
    document.querySelectorAll('.f-send').forEach(btn=>btn.onclick=()=>{
        nfSave(); const f=state.form;
        if(!f.heure&&f.type==='hotel') f.heure='';
        const err=m=>showToast(`${icon('alert',13)} ${m}`);
        if(!f.dem) return err(f.invite?'Indiquez votre prénom et nom':'Choisissez votre nom (demandeur)');
        if(f.type==='repas'){ if(!String(f.participants||'').trim()) return err('Les participants du repas sont obligatoires'); }
        else if(!f.pourQui.length) return err('Indiquez pour qui');
        if(!f.date) return err('Choisissez la date');
        if(f.type!=='hotel'&&!f.heure) return err('Choisissez l’heure');
        if(f.type==='repas'){ if(!f.presta) return err('Choisissez le restaurant'); if(!f.lieu) return err('Le lieu de livraison est obligatoire'); }
        if(f.type==='hotel'){ if(!f.lieu) return err('La ville est obligatoire'); f.dateDepart=nfDepart(f); }
        if(f.type==='taxi'){
            if(!f.de) return err('L’adresse de départ est obligatoire');
            if(!f.vers) return err('L’adresse d’arrivée est obligatoire');
            if(!f.tel) return err('Le téléphone du passager est obligatoire');
            const t=(String(f.de)+' '+String(f.vers)).toLowerCase();
            const needsVol=['aéroport','aeroport','cdg','orly','roissy','beauvais','gare','saint-lazare','montparnasse'].some(w=>t.includes(w));
            if(needsVol&&!f.vol) return err('N° de vol / train obligatoire pour une gare ou un aéroport');
        }
        if(f.type==='coursier'){ if(!String(f.desc||'').trim()) return err('Indiquez l’objet à livrer'); if(!f.de) return err('L’adresse d’enlèvement est obligatoire'); if(!f.vers) return err('L’adresse de livraison est obligatoire'); }
        if(f.type==='hotel') f.heure=f.heure||'';
        if(f.type==='repas'){ const rt=regimesTxt(f); if(rt&&!String(f.com||'').startsWith(rt)) f.com=rt+(f.com?' — '+f.com:''); }
        _submitForm();
    });

    document.querySelectorAll('[data-reset-form]').forEach(el=>el.onclick=()=>setState({form:{type:null,step:1,sent:false,dem:"",pourQui:[],pourQuiAutre:"",participants:"",vol:"",copyMail:false,date:today(),dateDepart:"",heure:"12h00",lieu:"",de:"",vers:"",presta:"",desc:"",nb:"1",com:""}}));
    document.querySelectorAll('[data-back-admin-agenda]').forEach(el=>el.onclick=()=>{ const c=(state.data||[]).find(x=>x.code===state.form.code); const d=c&&parseDate(c.date); state.flashId=c&&c.id; setState({vue:'admin',authed:true,adminTab:'calendrier',saisieDirecte:false,calDay:d?isoDay(d):null,calMonth:d?`${d.getFullYear()}-${d.getMonth()}`:null,form:{type:null,step:1,sent:false,dem:"",pourQui:[],pourQuiAutre:"",participants:"",vol:"",copyMail:false,date:today(),dateDepart:"",heure:"12h00",lieu:"",de:"",vers:"",presta:"",desc:"",nb:"1",com:""}}); });
    document.querySelectorAll('[data-back-admin-suivi]').forEach(el=>el.onclick=()=>{ const c=(state.data||[]).find(x=>x.code===state.form.code); state.flashId=c&&c.id; if(c) state.suiviStage=stageOf(c);
        setState({vue:'admin',authed:true,adminTab:'suivi',saisieDirecte:false,form:{type:null,step:1,sent:false,dem:"",pourQui:[],pourQuiAutre:"",participants:"",vol:"",copyMail:false,date:today(),dateDepart:"",heure:"12h00",lieu:"",de:"",vers:"",presta:"",desc:"",nb:"1",com:""}});
        setTimeout(()=>{ const n=document.querySelector('.suivi-card.flash'); if(n) n.scrollIntoView({block:'center',behavior:'smooth'}); },150); });

    // Saisie save
    // Admin form dropdown
    const afToggle=document.getElementById('afPqToggle');
    const afDropdown=document.getElementById('afPqDropdown');
    if(afToggle&&afDropdown){
        afToggle.onclick=e=>{e.stopPropagation();afDropdown.style.display=afDropdown.style.display==='none'?'block':'none';};
        document.addEventListener('click',e=>{if(!document.getElementById('afPqWrapper')?.contains(e.target))afDropdown.style.display='none';});
    }
    document.querySelectorAll('.af-pq-check').forEach(cb=>{
        cb.onchange=()=>{
            if(!state.adminForm)state.adminForm={};
            const af2=state.adminForm;
            // Préserver les champs déjà saisis avant le re-render (sinon une date tapée avant de cocher "pour qui" serait perdue)
            af2.date=document.getElementById('afDate')?.value||af2.date;
            af2.dateDepart=document.getElementById('afDateDepart')?.value||af2.dateDepart;
            af2.heure=document.getElementById('afHeure')?.value||af2.heure;
            af2.desc=document.getElementById('afDesc')?.value||af2.desc;
            af2.lieu=document.getElementById('afLieu')?.value||af2.lieu;
            af2.de=document.getElementById('afDe')?.value||af2.de;
            af2.vers=document.getElementById('afVers')?.value||af2.vers;
            af2.com=document.getElementById('afCom')?.value||af2.com;
            state.adminForm.pourQui=[...document.querySelectorAll('.af-pq-check:checked')].map(c=>c.value);
            const lbl=document.getElementById('afPqLabel');
            if(lbl){const names=state.adminForm.pourQui.filter(v=>v!=='__autre__');const hasAutre=state.adminForm.pourQui.includes('__autre__');lbl.textContent=names.join(', ')+(hasAutre?(names.length?', Autre':'Autre'):'') || '— Choisir —';}
            // Re-render si autre coché pour afficher input
            render();
        };
    });

    // Auto-fill Yooz quand prestataire change
    const afPrestaEl=document.getElementById('afPresta');
    if(afPrestaEl) afPrestaEl.onchange=()=>{
        const yoozEl=document.getElementById('afYooz');
        if(yoozEl && YOOZ_MAP[afPrestaEl.value]) yoozEl.value=YOOZ_MAP[afPrestaEl.value];
        if(!state.adminForm) state.adminForm={};
        state.adminForm.presta=afPrestaEl.value;
        state.adminForm.yooz=yoozEl?.value||'';
    };

    // Save admin form
    const saveAF=document.getElementById('saveAdminForm');
    if(saveAF)saveAF.onclick=async()=>{
        const af=state.adminForm||{};
        const t=state.saisieType;
        const dem=document.getElementById('afDem')?.value||'';
        af.pourQui=[...document.querySelectorAll('.af-pq-check:checked')].map(c=>c.value);
        af.pourQuiAutre=document.getElementById('afPqAutre')?.value||'';
        const pourQuiLabel=af.pourQui.includes('__autre__')?(af.pourQuiAutre||'Autre'):af.pourQui.join(', ');
        const rawDate=document.getElementById('afDate')?.value||today();
        const date=rawDate.includes('-')?rawDate.split('-').reverse().join('/'):rawDate;
        const rawDateDepart=document.getElementById('afDateDepart')?.value||'';
        const dateDepart=rawDateDepart?(rawDateDepart.includes('-')?rawDateDepart.split('-').reverse().join('/'):rawDateDepart):'';
        const heure=document.getElementById('afHeure')?.value||'12h00';
        const com=document.getElementById('afCom')?.value||'';
        const prix=parseFloat(document.getElementById('afPrix')?.value)||0;
        const paie=document.getElementById('afPaie')?.value||'CB';
        let yooz="";
        const tel=document.getElementById('afTel')?.value||'';
        let desc='',lieu='',nb=1,presta='',depart='',arrivee='',vol='';
        if(t==='repas'){
            desc=document.getElementById('afDesc')?.value||'';
            lieu=document.getElementById('afLieu')?.value||'';
            nb=parseInt(document.getElementById('afNb')?.value)||1;
            presta=document.getElementById('afPresta')?.value||'';
        } else if(t==='taxi'){
            desc=document.getElementById('afDesc')?.value||'';
            depart=document.getElementById('afDe')?.value||'';
            arrivee=document.getElementById('afVers')?.value||'';
            vol=document.getElementById('afVol')?.value||'';
            presta=document.getElementById('afPresta')?.value||'';
            lieu=depart;
        } else if(t==='hotel'){
            desc=document.getElementById('afDesc')?.value||'';
            lieu=document.getElementById('afLieu')?.value||'';
            presta=document.getElementById('afPresta')?.value||'';
            if(!dateDepart){showToast(`${icon('alert',13)} La date de départ est obligatoire`);return;}
        } else {
            presta=document.getElementById('afPresta')?.value||'';
            lieu=document.getElementById('afLieu')?.value||'';
            desc=document.getElementById('afDesc')?.value||'';
        }
        yooz=document.getElementById('afYooz')?.value||YOOZ_MAP[presta]||'';
        if(!dem){showToast(`${icon('alert',13)} Choisir une assistante`);return;}
        const newCmd={id:Date.now(),pris:"OUI",demandeur:dem,pourQui:pourQuiLabel,date,dateDepart,desc,lieu,heure,presta,prix,paie,nb,comment:com,type:t,depart,arrivee,vol,yooz,tel};
        state.data=[newCmd,...state.data];
        state.saisieType=null;
        state.adminForm=null;
        showToast('✓ Commande ajoutée · aucun email envoyé');
        state.adminTab='activite';state.resaFilter='all';
        render();
        const savedCmd=await dbInsert(newCmd);
        if(savedCmd.id!==newCmd.id){state.data=state.data.map(c=>c.id===newCmd.id?savedCmd:c);}
        logAction('Création', savedCmd, 'saisie admin');
        setSuivi([savedCmd.id],()=>({direct:new Date().toISOString(),par:personne(savedCmd.demandeur).role==='invite'?userName():null}));
        // Saisie directe par un admin : pas d'email
    };

    // Settings helpers
    function updS(ns){settings=ns;saveSettings(settings);refreshGlobals();showToast("✓ Réglages sauvegardés");render();}
    document.getElementById('reset-settings')?.addEventListener('click',()=>updS({assistantes:[...DEFAULT_ASSISTANTES],directeurs:[...DEFAULT_DIRECTEURS],prestatairesRepas:[...DEFAULT_PREPAS],prestatairesTaxi:[...DEFAULT_PTAXI],prestatairesCommande:[...DEFAULT_PCMD],prestatairesHotel:[...DEFAULT_PHOTEL],emails:{...DEFAULT_EMAILS}}));

    // Save all emails
    // Admin emails handlers
    document.getElementById('addAdminEmail')?.addEventListener('click',()=>{
        settings.adminEmails=[...(settings.adminEmails||[]),''];
        render();
    });
    document.querySelectorAll('[data-rm-admin]').forEach(btn=>{
        btn.addEventListener('click',()=>{
            if(!confirm('Supprimer cet email ?'))return;
            const i=parseInt(btn.getAttribute('data-rm-admin'));
            settings.adminEmails=(settings.adminEmails||[]).filter((_,idx)=>idx!==i);
            render();
        });
    });
    document.getElementById('enableNotifs')?.addEventListener('click',activateAll);
    document.querySelectorAll('[data-activate-notifs]').forEach(el=>el.onclick=async()=>{
        if(notifsReady()){ await systemNotify('Notifications actives','Tout fonctionne sur cet appareil.'); updateBadge(); showToast('✓ Notifications déjà actives · pastille à jour'); return; }
        activateAll();
    });
    document.querySelectorAll('[data-notif-banner-off]').forEach(el=>el.onclick=()=>{ lsSet('notif_banner_off','1'); state.notifHelp=false; render(); });
    document.getElementById('acctSaveNom')?.addEventListener('click',async()=>{
        const nom=(document.getElementById('acctNom')?.value||'').trim(); if(!nom) return;
        try{ await authUpdate({data:{nom}}); showToast('✓ Nom enregistré'); render(); }catch(e){ showToast(`${icon('alert',13)} ${e.message}`); }
    });
    document.getElementById('acctSavePass')?.addEventListener('click',async()=>{
        const pw=document.getElementById('acctPass')?.value||'';
        if(pw.length<6){ showToast('6 caractères minimum'); return; }
        try{ await authUpdate({password:pw}); showToast('✓ Mot de passe changé'); render(); }catch(e){ showToast(`${icon('alert',13)} ${e.message}`); }
    });
    document.getElementById('loginObligatoire')?.addEventListener('change',e=>{
        settings.loginObligatoire=!!e.target.checked; saveSettings(settings);
        showToast(settings.loginObligatoire?'✓ Connexion obligatoire activée':'Connexion obligatoire désactivée'); render();
    });
    document.querySelectorAll('[data-goto-trash]').forEach(el=>el.onclick=()=>setState({adminTab:'activite',activiteTab:'corbeille',sel:[]}));
    document.getElementById('saveAdminEmails')?.addEventListener('click',()=>{
        const inputs=document.querySelectorAll('.admin-email-input');
        settings.adminEmails=[...inputs].map(i=>i.value.trim()).filter(Boolean);
        saveSettings(settings);
        showToast('✓ Emails admin sauvegardés');
    });

    document.getElementById('saveAllEmails')?.addEventListener('click',()=>{
        const newEmails={...settings.emails};
        let count=0;
        document.querySelectorAll('.email-input').forEach(input=>{
            const name=input.getAttribute('data-nom');
            const val=input.value.trim();
            newEmails[name]=val;
            // Visual feedback
            const statusEl=document.getElementById('email-status-'+name.replace(/ /g,'_'));
            if(statusEl){
                if(val && val.includes('@')){ statusEl.textContent='✅'; count++; }
                else if(val){ statusEl.textContent='⚠️'; }
                else { statusEl.textContent=''; }
            }
        });
        settings.emails=newEmails;
        saveSettings(settings);
        showToast(`✓ ${count} email${count>1?'s':''} sauvegardé${count>1?'s':''}`);
    });
    document.getElementById('addAssistante')?.addEventListener('click',()=>{
        const ni=document.getElementById('newAssistante');
        const ei=document.getElementById('newAssistanteEmail');
        const v=ni?.value.trim();
        const email=ei?.value.trim()||'';
        if(v && !settings.assistantes.includes(v)){
            updS({...settings,assistantes:[...settings.assistantes,v],emails:{...(settings.emails||{}),[v]:email}});
        }
        if(ni)ni.value='';
        if(ei)ei.value='';
    });
    const addMap=[['addDirecteur','newDirecteur','directeurs'],['addPrepas','newPrepas','prestatairesRepas'],['addPtaxi','newPtaxi','prestatairesTaxi'],['addPcmd','newPcmd','prestatairesCommande'],['addPhotel','newPhotel','prestatairesHotel']];
    addMap.forEach(([btnId,inputId,key])=>document.getElementById(btnId)?.addEventListener('click',()=>{
        const i=document.getElementById(inputId);
        const v=i?.value.trim();
        if(v&&!settings[key].includes(v)){
            const ns={...settings,[key]:[...settings[key],v]};
            if(key==='assistantes' && !Object.prototype.hasOwnProperty.call(settings.emails||{},v)){
                ns.emails={...(settings.emails||{}),[v]:''};
            }
            updS(ns);
        }
        if(i)i.value='';
    }));
    const rmMap=[['remove-assistante','assistantes'],['remove-directeur','directeurs'],['remove-typerepas','typesRepas'],['remove-prepas','prestatairesRepas'],['remove-ptaxi','prestatairesTaxi'],['remove-pcmd','prestatairesCommande'],['remove-photel','prestatairesHotel']];
    // Handler suppression réglages via délégation
    if(!window._rmHandlerSet){
        window._rmHandlerSet = true;
        const keyMap={'remove-assistante':'assistantes','remove-directeur':'directeurs','remove-typerepas':'typesRepas','remove-prepas':'prestatairesRepas','remove-ptaxi':'prestatairesTaxi','remove-pcmd':'prestatairesCommande','remove-photel':'prestatairesHotel'};
        document.addEventListener('click', e=>{
            // Confirmation suppression réglages
            if(e.target.closest('[data-confirm-rm-yes]')){
                const {attr,idx}=state.confirmRm||{};
                const key=keyMap[attr];
                if(key&&!isNaN(idx)){
                    const removed=settings[key][idx];
                    settings[key]=settings[key].filter((_,i)=>i!==idx);
                    if(key==='assistantes' && settings.emails && Object.prototype.hasOwnProperty.call(settings.emails,removed)){
                        const ne={...settings.emails};
                        delete ne[removed];
                        settings.emails=ne;
                    }
                    updS({...settings});
                }
                state.confirmRm=null;
                render();
                return;
            }
            if(e.target.closest('[data-confirm-rm-no]')){
                state.confirmRm=null;
                render();
                return;
            }
            const btn = e.target.closest('[data-rm][data-idx]');
            if(!btn) return;
            e.stopPropagation();
            const attr = btn.getAttribute('data-rm');
            const key = keyMap[attr];
            if(!key) return;
            const idx = parseInt(btn.getAttribute('data-idx'));
            if(isNaN(idx)) return;
            state.confirmRm={attr,idx};
            render();
        });
    }
}

let _rt;
window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(render,120);});

// ── Service worker (appli installable). Ignoré en local (file://). ──
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)));
}

// ── INIT : chargement depuis Supabase ──
(async () => {
    authLoad();
    // Lien « mot de passe oublié » : Supabase revient sur l'appli avec #access_token=…&type=recovery
    try{
        const h=new URLSearchParams(location.hash.replace(/^#/,''));
        if(h.get('access_token') && (h.get('type')==='recovery' || h.get('type')==='invite' || h.get('type')==='signup')){
            const tok=h.get('access_token');
            const u=await (await fetch(`${SB_URL}/auth/v1/user`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${tok}`}})).json();
            authSave({access_token:tok, refresh_token:h.get('refresh_token'), expires_at:Date.now()+(+h.get('expires_in')||3600)*1000, user:u});
            if(h.get('type')==='recovery'||h.get('type')==='invite') state.authMode='reset';
            history.replaceState(null,'',location.pathname+location.search);
        } else if(h.get('error_description')){
            state.authError=decodeURIComponent(h.get('error_description')).replace(/\+/g,' ');
            state.loginScreen=true; history.replaceState(null,'',location.pathname+location.search);
        }
    }catch(e){ console.error('Lien de connexion:',e); }
    if(location.hash==='#express') state.express=true;
    if(location.hash==='#live'){ state.live=true; state.vue='admin'; }
    if(AUTH && AUTH.expires_at < Date.now()+60000) await authRefresh();
    setInterval(()=>{ if(AUTH && AUTH.expires_at < Date.now()+5*60000) authRefresh(); }, 10*60000);
    render(); // affiche l'écran de chargement
    // Charger réglages ET commandes en parallèle
    const [data] = await Promise.all([
        dbLoad(),
        loadSettingsFromDB(),
        loadSuivi()
    ]);
    state.data = data;
    trackFirstSeen(data);
    // Session admin encore valide → on revient directement dans l'admin
    if (sessionValid()) {
        await Promise.all([loadTrash(), loadJournal(), /avonde/i.test(`${userEmail()} ${userName()}`)?loadMe():null]);
        if (lsGet('last_vue') === 'admin' || state.live) { state.vue = 'admin'; state.authed = true; state.adminTab = 'dashboard'; }
    }
    state.loading = false;
    render();

    // Rafraîchissement : chaque minute sur un appareil admin, toutes les 5 min sinon
    let _seenPending = new Set(state.data.filter(c=>c.pris==='En attente').map(c=>c.id));
    async function poll(){
        try{
            const activeEl = document.activeElement;
            const isTyping = activeEl && (activeEl.tagName==='INPUT'||activeEl.tagName==='TEXTAREA'||activeEl.tagName==='SELECT');
            const isInForm = state.form && state.form.step >= 1 && state.form.type && !state.form.sent;
            const fresh=await dbLoad();
            const nouvelles=fresh.filter(c=>c.pris==='En attente'&&!_seenPending.has(c.id));
            _seenPending=new Set(fresh.filter(c=>c.pris==='En attente').map(c=>c.id));
            if(isTyping || isInForm){ updateBadgeFrom(fresh); return; }
            state.data=fresh;
            trackFirstSeen(fresh);
            if(state.vue==='admin' && state.authed){ await Promise.all([loadTrash(), loadJournal(), loadSuivi()]); }
            else if(AUTH){ await loadSuivi(); }
            render();
            if(sessionValid() && nouvelles.length){
                const n=nouvelles.length, c=nouvelles[0];
                if(state.vue==='admin') showToast(`${icon('bell',13)} ${n} nouvelle${n>1?'s':''} demande${n>1?'s':''} !`);
                systemNotify(n>1?`${n} nouvelles demandes`:`Nouvelle demande · ${TYPE_LABEL[c.type]||''}`,
                    n>1?'À valider dans Gestion des commandes':`${$d(c.date)}${c.heure?' '+c.heure:''} · ${c.type==='commande'?(c.presta||'Commande'):(c.desc||'')} · ${c.demandeur||''}`);
            }
        } catch(e){}
    }
    function updateBadgeFrom(list){ const keep=state.data; state.data=list; updateBadge(); state.data=keep; }
    let _pollTimer=null;
    function schedulePoll(){ clearInterval(_pollTimer); _pollTimer=setInterval(poll, sessionValid()?60000:300000); }
    schedulePoll();
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ poll(); schedulePoll(); } });
})();
</script>
